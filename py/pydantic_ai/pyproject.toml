[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-atomicmail"
version = "0.1.0"
description = "Pydantic AI toolset and capability giving agents a real email inbox with Atomic Mail"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Atomic Mail"},
]
keywords = [
  "atomic-mail",
  "atomicmail",
  "pydantic-ai",
  "toolset",
  "capability",
  "agent",
  "ai",
  "jmap",
  "email",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic-ai-slim>=1.0.0,<3",
]

[project.urls]
Homepage = "https://atomicmail.ai"
Source = "https://github.com/Atomic-Mail/atomic-mail-agentic"
Documentation = "https://docs.atomicmail.ai/pydantic-ai"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomicmail = ["vendor/shared/**/*"]
