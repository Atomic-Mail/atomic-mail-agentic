name: atomicmail
label: Atomic Mail
kind: platform
version: 0.1.0
manifest_version: 2
description: >
  Atomic Mail Agentic for Hermes: the agent gets its own @atomicmail.ai address with
  one command, no account or signup form. Mail from your allowed addresses wakes the
  agent and its answer goes back in the same thread; each sender is checked with DKIM
  first, so a forged From: cannot drive the agent. Tools read, search, send and reply,
  and schedule meetings with real calendar invitations.
author: Atomic Mail
license: MIT
homepage: https://github.com/Atomic-Mail/atomic-mail-agentic/tree/main/integrations/hermes-plugin
tags: [email, channel, calendar, atomicmail]
requires_hermes: ">=0.23.1"
python_dependencies:
  - "dkimpy>=1.1.0,<1.2"
  - "dnspython>=2.6.1,<3"
requires_env:
  - name: ATOMICMAIL_API_KEY
    description: "API key of the agent's inbox. Leave empty and run `hermes atomicmail setup`: it creates the inbox (no account needed) and saves the key."
    prompt: "Atomic Mail API key (Enter to skip)"
    url: "https://atomicmail.ai"
    password: true
optional_env:
  - name: ATOMICMAIL_ALLOWED_USERS
    description: "Comma-separated sender addresses allowed to give the agent instructions by email. Everyone else is ignored."
    prompt: "Allowed senders (comma-separated)"
    password: false
  - name: ATOMICMAIL_ADDRESS
    description: "The agent's address (setup writes it; informational)."
    prompt: "Agent address"
    password: false
  - name: ATOMICMAIL_HOME_ADDRESS
    description: "Where cron jobs delivered to `atomicmail` are sent (default: the only allowed sender)."
    prompt: "Home address"
    password: false
  - name: ATOMICMAIL_ALLOW_ALL_USERS
    description: "true lets any sender instruct the agent (DKIM still required). Not recommended."
    prompt: "Allow all senders? (true/false)"
    password: false
  - name: ATOMICMAIL_TRUST_FROM_HEADER
    description: "true skips the DKIM sender check and trusts the From: header. Not recommended."
    prompt: "Trust From: without DKIM? (true/false)"
    password: false
  - name: ATOMICMAIL_DNS_OVER_HTTPS
    description: "DKIM key lookups: auto (system DNS, then DNS-over-HTTPS at Cloudflare/Google when it returns nothing; default), always, or off."
    prompt: "DNS-over-HTTPS for DKIM (auto/always/off)"
    password: false
  - name: ATOMICMAIL_POLL_INTERVAL
    description: "Seconds between inbox checks (default 20, minimum 10)."
    prompt: "Poll interval (seconds)"
    password: false
  - name: ATOMICMAIL_AUTH_URL
    description: "Auth service (default https://auth.atomicmail.ai)."
    prompt: "Auth URL"
    password: false
  - name: ATOMICMAIL_API_URL
    description: "JMAP API (default https://api.atomicmail.ai)."
    prompt: "API URL"
    password: false
provides_tools:
  - atomicmail_whoami
  - atomicmail_read_inbox
  - atomicmail_read_message
  - atomicmail_search
  - atomicmail_send
  - atomicmail_reply
  - atomicmail_send_invite
  - atomicmail_update_invite
  - atomicmail_cancel_invite
  - atomicmail_list_invites
  - atomicmail_respond_to_invite
